# 优品汇 · 腾讯云托管 PostgreSQL 适配
# 激活方式：--spring.profiles.active=pg 或 SPRING_PROFILES_ACTIVE=pg
# 数据库连接信息全部走环境变量，在云托管控制台配置

# ===== 数据源（PostgreSQL）=====
spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT:5432}/${PG_DB:seconddata}?sslmode=${PG_SSLMODE:require}&stringtype=unspecified
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Flyway：独立 PG 迁移目录（V1 为 V1~V22 合并终态，勿与 MySQL 目录混用）=====
spring.flyway.locations=classpath:db/migration-pg
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===== 连接池：PG 行锁等待用 lock_timeout（对齐 MySQL innodb_lock_wait_timeout=5s）=====
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# ===== 云托管容器：单实例 Caffeine 足够；多实例再切 Redis =====
spring.cache.type=caffeine

# ===== HTTPS 终结在云托管网关：Cookie Secure + 信任反向代理头 =====
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

# ===== 生产安全默认（与 application-prod 对齐）=====
mall.wallet.mock-recharge-enabled=false
mall.user.initial-balance=0
mall.demo-data.enabled=false
spring.sql.init.mode=never
mall.security.legacy-password-repair=false
mall.security.log-mail-codes=false
mall.security.admin-init-password=${MALL_ADMIN_PASSWORD:}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
mall.security.swagger-basic-auth-enabled=false

# ===== 文件存储：挂载云盘/共享卷后通过 MALL_STORAGE_ROOT 指定 =====
mall.storage.type=local
mall.storage.root=${MALL_STORAGE_ROOT:}

# ===== 可选：邮件 / 高德（控制台注入）=====
# MAIL_USERNAME / MAIL_PASSWORD / AMAP_WEB_KEY 同默认配置的环境变量名

# ===== 日志 =====
logging.level.com.secondhand.mall=WARN
spring.thymeleaf.cache=true

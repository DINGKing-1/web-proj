<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 优品汇' : '优品汇 - 高端二手交易平台'}">优品汇</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <th:block th:replace="${head} :: head" th:if="${head != null}"></th:block>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo">
                <a href="/">
                    <div class="logo-icon"><i class="fas fa-gem"></i></div>
                    <span class="logo-text">优品汇</span>
                </a>
            </div>
            <div class="search-bar">
                <form action="/search" method="GET">
                    <input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input">
                    <button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <div class="nav-actions">
                <th:block th:if="${isLoggedIn}">
                    <a href="/cart" class="btn btn-ghost" aria-label="购物车" style="position:relative;"><i class="fas fa-shopping-cart"></i><span class="cart-count-badge" style="display:none">0</span></a>
                    <a href="/upload" class="btn btn-outline"><i class="fas fa-plus"></i> 发布</a>
                    <div class="user-dropdown" style="position:relative;">
                        <button class="btn btn-ghost user-menu-btn" style="gap:8px;">
                            <img src="/user-avatar/default.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;" onerror="this.src='/user-avatar/default.jpg'">
                            <span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${sessionNickname != null ? sessionNickname : sessionUsername}">用户</span>
                            <i class="fas fa-chevron-down" style="font-size:10px;"></i>
                        </button>
                    </div>
                </th:block>
                <th:block th:unless="${isLoggedIn}">
                    <a href="/login" class="btn btn-outline">登录</a>
                    <a href="/login" class="btn btn-accent">注册</a>
                </th:block>
            </div>
        </nav>
    </header>

    <!-- Category Bar -->
    <section class="category-bar">
        <div class="category-container">
            <a href="/category/手机" class="category-item">手机</a>
            <a href="/category/笔记本电脑" class="category-item">笔记本电脑</a>
            <a href="/category/耳机" class="category-item">耳机</a>
            <a href="/category/相机" class="category-item">相机</a>
            <a href="/category/手机壳" class="category-item">手机壳</a>
            <a href="/category/空调" class="category-item">空调</a>
            <a href="/category/冰箱" class="category-item">冰箱</a>
            <a href="/category/半身裙" class="category-item">半身裙</a>
            <a href="/category/其他" class="category-item">其他</a>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content" th:replace="${content} :: content"></main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h4>优品汇</h4>
                <p>致力于打造高端二手交易平台，让每一件好物都找到懂它的新主人。</p>
            </div>
            <div class="footer-section">
                <h4>探索</h4>
                <ul>
                    <li><a href="/category/手机">手机</a></li>
                    <li><a href="/category/笔记本电脑">笔记本电脑</a></li>
                    <li><a href="/category/耳机">耳机</a></li>
                    <li><a href="/category/相机">相机</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>服务</h4>
                <ul>
                    <li><a href="#">帮助中心</a></li>
                    <li><a href="#">交易保障</a></li>
                    <li><a href="#">联系我们</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>关注</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-weixin"></i></a>
                    <a href="#"><i class="fab fa-weibo"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 优品汇 All Rights Reserved</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <th:block th:replace="${scripts} :: scripts" th:if="${scripts != null}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 优品汇</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <a href="#main-content" class="skip-link">跳到主要内容</a>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">
                <a href="/">
                    <div class="logo-icon"><i class="fas fa-gem"></i></div>
                    <span class="logo-text">优品汇</span>
                </a>
            </div>
            <div class="search-bar">
                <form action="/search" method="GET">
                    <input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input">
                    <button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <div class="nav-actions">
                <a href="/" class="btn btn-ghost"><i class="fas fa-home"></i> 首页</a>
            </div>
        </nav>
    </header>

    <section class="category-bar">
        <div class="category-container">
            <a href="/category/全部" class="category-item">全部</a>
            <a href="/category/手机" class="category-item">手机</a>
            <a href="/category/笔记本电脑" class="category-item">笔记本电脑</a>
            <a href="/category/耳机" class="category-item">耳机</a>
            <a href="/category/相机" class="category-item">相机</a>
            <a href="/category/手机壳" class="category-item">手机壳</a>
            <a href="/category/空调" class="category-item">空调</a>
            <a href="/category/冰箱" class="category-item">冰箱</a>
            <a href="/category/半身裙" class="category-item">半身裙</a>
            <a href="/category/其他" class="category-item">其他</a>
        </div>
    </section>

    <main class="main-content" id="main-content">
        <div class="auth-page">
            <div class="auth-container">
                <div class="auth-header">
                    <div class="logo-icon" style="margin:0 auto 16px;"><i class="fas fa-gem"></i></div>
                    <h1>欢迎来到优品汇</h1>
                    <p>登录或注册以享受更多服务</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">登录</button>
                    <button class="auth-tab" onclick="switchTab('register')">注册</button>
                </div>

                <form id="loginForm" class="auth-form active" onsubmit="return false;">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" name="username" class="form-input" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <div class="password-field">
                            <input type="password" id="loginPassword" name="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
                            <button type="button" class="password-toggle" aria-label="显示密码" onclick="App.togglePassword('loginPassword')"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-accent">登 录</button>
                    </div>
                    <div class="auth-footer">
                        还没有账户？<a href="javascript:void(0)" onclick="switchTab('register')">立即注册</a>
                    </div>
                </form>

                <form id="registerForm" class="auth-form" onsubmit="return false;">
                    <div class="form-group">
                        <label for="regUsername">用户名 <span class="required">*</span></label>
                        <input type="text" id="regUsername" name="username" class="form-input" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="regNickname">昵称 <span class="required">*</span></label>
                        <input type="text" id="regNickname" name="nickname" class="form-input" placeholder="如何称呼你？" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">手机号</label>
                        <input type="tel" id="regPhone" name="phone" class="form-input" placeholder="请输入手机号（选填）" autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">邮箱</label>
                        <input type="email" id="regEmail" name="email" class="form-input" placeholder="请输入邮箱（选填）" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">密码 <span class="required">*</span></label>
                        <div class="password-field">
                            <input type="password" id="regPassword" name="password" class="form-input" placeholder="请设置密码（6位以上）" required autocomplete="new-password">
                            <button type="button" class="password-toggle" aria-label="显示密码" onclick="App.togglePassword('regPassword')"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="regPasswordConfirm">确认密码 <span class="required">*</span></label>
                        <div class="password-field">
                            <input type="password" id="regPasswordConfirm" name="password_confirm" class="form-input" placeholder="请再次输入密码" required autocomplete="new-password">
                            <button type="button" class="password-toggle" aria-label="显示密码" onclick="App.togglePassword('regPasswordConfirm')"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-accent">注 册</button>
                    </div>
                    <div class="auth-footer">
                        已有账户？<a href="javascript:void(0)" onclick="switchTab('login')">立即登录</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section"><h4>优品汇</h4><p>致力于打造高端二手交易平台。</p></div>
            <div class="footer-section"><h4>服务</h4><ul><li><a href="#">帮助中心</a></li><li><a href="#">交易保障</a></li></ul></div>
            <div class="footer-section"><h4>关注</h4><div class="social-links"><a href="#"><i class="fab fa-weixin"></i></a><a href="#"><i class="fab fa-weibo"></i></a></div></div>
        </div>
        <div class="footer-bottom"><p>&copy; 2026 优品汇 All Rights Reserved</p></div>
    </footer>

    <script src="/js/main.js"></script>
    <script>
    function switchTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.auth-form').forEach(function(el) { el.classList.remove('active'); });
        if (tab === 'login') {
            document.querySelector('.auth-tab:first-child').classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelector('.auth-tab:last-child').classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }
    }
    // Check for #register in URL
    if (window.location.hash === '#register') { switchTab('register'); }
    // Check for kicked message
    if (new URLSearchParams(window.location.search).get('kicked') === '1') {
        App.toast('您的账号已在其他地方登录', 'warning');
    }
    </script>
</body>
</html>

{% extends 'base.html' %}

{% block title %}注册 - 优品汇{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-title">
            <h1>创建账户</h1>
            <p>加入优品汇，开始您的品质生活</p>
        </div>
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" name="phone" placeholder="请输入手机号" required>
            </div>
            
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="email" placeholder="请输入邮箱" required>
            </div>
            
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请设置密码（6-20位）" required>
            </div>
            
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="password_confirm" placeholder="请再次输入密码" required>
            </div>
            
            <div class="form-options">
                <label>
                    <input type="checkbox" name="agree" required> 我已阅读并同意<a href="/terms">《服务协议》</a>和<a href="/privacy">《隐私政策》</a>
                </label>
            </div>
            
            <button type="submit" class="auth-btn">注册</button>
        </form>
        
        <div class="auth-divider">
            <span>或</span>
        </div>
        
        <div class="auth-switch">
            已有账户？<a href="/login">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}

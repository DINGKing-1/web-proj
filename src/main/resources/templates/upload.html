<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布商品 - 优品汇</title>
    <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    .multi-image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
    .multi-image-item { position: relative; aspect-ratio: 1; border-radius: var(--radius-md); overflow: hidden; border: 2px solid rgba(255,255,255,0.3); }
    .multi-image-item img { width: 100%; height: 100%; object-fit: cover; }
    .multi-image-item .remove-btn { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(200,75,65,0.85); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .multi-image-item.add-slot { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.3); border: 2px dashed rgba(255,255,255,0.4); cursor: pointer; font-size: 28px; color: var(--color-text-light); transition: all var(--transition-normal); }
    .multi-image-item.add-slot:hover { border-color: var(--color-accent); color: var(--color-accent-dark); background: rgba(212,167,69,0.08); }
    .multi-image-item.drag-over { border-color: var(--color-accent) !important; box-shadow: 0 0 0 3px rgba(212,167,69,0.2); transform: scale(1.03); }
    .qty-control { display: inline-flex; align-items: center; gap: 0; border-radius: 50px; overflow: hidden; border: 1px solid rgba(255,255,255,0.4); }
    .qty-control button { width: 42px; height: 42px; font-size: 18px; background: rgba(255,255,255,0.4); border: none; cursor: pointer; color: var(--color-text); transition: all var(--transition-fast); }
    .qty-control button:hover { background: rgba(255,255,255,0.7); }
    .qty-control input { width: 56px; height: 42px; text-align: center; font-size: 16px; font-weight: 600; border: none; background: rgba(255,255,255,0.5); color: var(--color-text); }
    .qty-control input::-webkit-outer-spin-button, .qty-control input::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo"><a href="/"><div class="logo-icon"><i class="fas fa-gem"></i></div><span class="logo-text">优品汇</span></a></div>
            <div class="search-bar"><form action="/search" method="GET"><input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input">                    <button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button></form></div>
            <div class="nav-actions"><th:block th:if="${isLoggedIn}">                    <a href="/cart" class="btn btn-ghost" aria-label="购物车" style="position:relative;"><i class="fas fa-shopping-cart"></i><span class="cart-count-badge" style="display:none">0</span></a> <a href="/upload" class="btn btn-outline"><i class="fas fa-plus"></i> 发布</a> <div class="user-dropdown" style="position:relative;"><button class="btn btn-ghost user-menu-btn" style="gap:8px;"><img src="/user-avatar/default.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;" onerror="this.src='/user-avatar/default.jpg'"><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${sessionNickname != null ? sessionNickname : sessionUsername}">用户</span><i class="fas fa-chevron-down" style="font-size:10px;"></i></button></div></th:block><th:block th:unless="${isLoggedIn}"><a href="/login" class="btn btn-outline">登录</a><a href="/login" class="btn btn-accent">注册</a></th:block></div>
        </nav>
    </header>
    <section class="category-bar"><div class="category-container"><a href="/category/全部" class="category-item">全部</a><a href="/category/手机" class="category-item">手机</a><a href="/category/笔记本电脑" class="category-item">笔记本电脑</a><a href="/category/耳机" class="category-item">耳机</a><a href="/category/相机" class="category-item">相机</a><a href="/category/手机壳" class="category-item">手机壳</a><a href="/category/空调" class="category-item">空调</a><a href="/category/冰箱" class="category-item">冰箱</a><a href="/category/半身裙" class="category-item">半身裙</a><a href="/category/其他" class="category-item">其他</a></div></section>
    <main class="main-content" id="main-content">
        <div class="upload-page">
            <div class="page-header" style="text-align:center;"><h1>发布商品</h1><p>填写信息，让好物找到新主人</p></div>

            <!-- 多图上传 -->
            <div class="content-section">
                <h3><i class="fas fa-images"></i> 商品图片 <span style="font-weight:400;font-size:12px;color:var(--color-text-light);">（可上传多张，第一张为主图）</span></h3>
                <div class="multi-image-grid" id="imageGrid">
                    <div class="multi-image-item add-slot" onclick="document.getElementById('multiFileInput').click()">
                        <i class="fas fa-plus"></i>
                    </div>
                </div>
                <input type="file" id="multiFileInput" accept="image/*" multiple style="display:none" onchange="handleMultipleFiles(this.files)">
                <p style="font-size:12px;color:var(--color-text-light);margin-top:10px;">支持 JPG / PNG / WebP，每张最大 10MB</p>
            </div>

            <!-- 商品信息 -->
            <div class="content-section">
                <h3><i class="fas fa-info-circle"></i> 商品信息</h3>
                <div class="form-row">
                    <div class="form-group"><label>商品名称 <span class="required">*</span></label><input type="text" id="itemName" class="form-input" placeholder="例如: iPhone 15 Pro Max"></div>
                    <div class="form-group"><label>分类 <span class="required">*</span></label><select id="itemCategory" class="form-input"><option value="">请选择</option><option value="手机">手机</option><option value="笔记本电脑">笔记本电脑</option><option value="耳机">耳机</option><option value="相机">相机</option><option value="手机壳">手机壳</option><option value="空调">空调</option><option value="冰箱">冰箱</option><option value="半身裙">半身裙</option><option value="其他">其他</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>售价 (¥) <span class="required">*</span></label><input type="number" id="secondHandPrice" class="form-input" placeholder="你想卖的价格" min="0" step="0.01"></div>
                    <div class="form-group"><label>库存数量 <span class="required">*</span></label>
                        <div class="qty-control">
                            <button type="button" onclick="changeQty(-1)"><i class="fas fa-minus"></i></button>
                            <input type="number" id="itemQuantity" value="1" min="1" max="999" onchange="validateQty()">
                            <button type="button" onclick="changeQty(1)"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
                <div class="form-group"><label>新旧程度 <span class="required">*</span></label>
                    <div class="condition-options">
                        <div class="condition-opt"><input type="radio" name="condition" value="全新" id="c1"><label for="c1">全新</label></div>
                        <div class="condition-opt"><input type="radio" name="condition" value="几乎全新" id="c2"><label for="c2">几乎全新</label></div>
                        <div class="condition-opt"><input type="radio" name="condition" value="轻微使用" id="c3"><label for="c3">轻微使用</label></div>
                        <div class="condition-opt"><input type="radio" name="condition" value="明显使用" id="c4"><label for="c4">明显使用</label></div>
                        <div class="condition-opt"><input type="radio" name="condition" value="重度使用" id="c5"><label for="c5">重度使用</label></div>
                    </div>
                </div>
                <div class="form-group"><label>商品描述</label><textarea id="itemDescription" class="form-input" placeholder="详细描述商品的使用情况、配件等信息..."></textarea></div>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;">
                <button class="btn btn-outline" onclick="history.back()">取消</button>
                <button class="btn btn-accent btn-lg ripple" onclick="submitProduct()">发布商品</button>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="footer-container"><div class="footer-section"><h4>优品汇</h4><p>致力于打造高端二手交易平台。</p></div><div class="footer-section"><h4>服务</h4><ul><li><a href="#">帮助中心</a></li><li><a href="#">交易保障</a></li></ul></div><div class="footer-section"><h4>关注</h4><div class="social-links"><a href="#"><i class="fab fa-weixin"></i></a><a href="#"><i class="fab fa-weibo"></i></a></div></div></div><div class="footer-bottom"><p>&copy; 2026 优品汇 All Rights Reserved</p></div></footer>
    <script src="/js/main.js"></script>
    <script>
    var uploadedImageUrls = []; // 多图 URL 列表
    var dragSrcIndex = null;

    function handleMultipleFiles(files) {
        if (!files || files.length === 0) return;
        var toUpload = [];
        for (var i = 0; i < files.length; i++) {
            if (!files[i].type.match('image.*')) { App.toast(files[i].name + ' 不是图片', 'warning'); continue; }
            if (files[i].size > 10 * 1024 * 1024) { App.toast(files[i].name + ' 超过10MB', 'warning'); continue; }
            toUpload.push(files[i]);
        }
        if (toUpload.length === 0) return;

        // 先显示本地预览
        var readers = [];
        toUpload.forEach(function(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                readers.push(e.target.result);
                if (readers.length === toUpload.length) {
                    // 新图片追加到已有列表末尾
                    var existingPreviews = uploadedImageUrls.slice();
                    var newPreviews = existingPreviews.concat(readers);
                    refreshPreview(newPreviews);
                    uploadAllImages(readers);
                }
            };
            reader.readAsDataURL(file);
        });
    }

    function refreshPreview(previewUrls) {
        var grid = document.getElementById('imageGrid');
        grid.innerHTML = '';
        previewUrls.forEach(function(url, i) {
            var item = document.createElement('div');
            item.className = 'multi-image-item';
            item.draggable = true;
            item.dataset.index = i;
            item.innerHTML = '<img src="' + url + '" alt="预览" style="pointer-events:none;"><div class="remove-btn" onclick="event.stopPropagation();removeImage(' + i + ')"><i class="fas fa-times"></i></div>';
            // 拖拽事件
            item.addEventListener('dragstart', function(e) { dragSrcIndex = i; e.dataTransfer.effectAllowed = 'move'; this.style.opacity = '0.5'; });
            item.addEventListener('dragend', function(e) { this.style.opacity = '1'; document.querySelectorAll('.multi-image-item').forEach(function(el) { el.classList.remove('drag-over'); }); });
            item.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; this.classList.add('drag-over'); });
            item.addEventListener('dragleave', function(e) { this.classList.remove('drag-over'); });
            item.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                if (dragSrcIndex === null || dragSrcIndex === i) return;
                // 重排
                var moved = previewUrls.splice(dragSrcIndex, 1)[0];
                previewUrls.splice(i, 0, moved);
                uploadedImageUrls = previewUrls;
                refreshPreview(previewUrls);
                dragSrcIndex = null;
            });
            grid.appendChild(item);
        });
        // 添加按钮
        var addBtn = document.createElement('div');
        addBtn.className = 'multi-image-item add-slot';
        addBtn.innerHTML = '<i class="fas fa-plus"></i>';
        addBtn.onclick = function() { document.getElementById('multiFileInput').click(); };
        grid.appendChild(addBtn);
    }

    function uploadAllImages(base64List) {
        App.api('/api/upload-image', { method: 'POST', body: { image: base64List } })
        .then(function(data) {
            if (data.success && data.imageUrls) {
                // 追加新上传的 URL 到已有列表
                uploadedImageUrls = uploadedImageUrls.concat(data.imageUrls);
                refreshPreview(uploadedImageUrls);
                App.toast('已上传 ' + data.imageUrls.length + ' 张图片', 'success');
            } else {
                App.toast(data.message || '上传失败', 'error');
            }
        });
    }

    function removeImage(index) {
        uploadedImageUrls.splice(index, 1);
        refreshPreview(uploadedImageUrls);
    }

    function changeQty(delta) {
        var input = document.getElementById('itemQuantity');
        var val = parseInt(input.value) || 1;
        val = Math.max(1, Math.min(999, val + delta));
        input.value = val;
    }

    function validateQty() {
        var input = document.getElementById('itemQuantity');
        var val = parseInt(input.value);
        if (isNaN(val) || val < 1) input.value = 1;
        if (val > 999) input.value = 999;
    }

    function submitProduct() {
        var user = App.getUser();
        if (!user) { App.modal({ type: 'warning', title: '请先登录', message: '登录后才能发布商品', okText: '去登录', onOk: function() { window.location.href = '/login'; } }); return; }
        var name = document.getElementById('itemName').value.trim();
        var category = document.getElementById('itemCategory').value;
        var secondHandPrice = parseFloat(document.getElementById('secondHandPrice').value);
        var condition = document.querySelector('input[name="condition"]:checked');
        var description = document.getElementById('itemDescription').value.trim();
        var quantity = parseInt(document.getElementById('itemQuantity').value) || 1;
        if (!name || !category || !secondHandPrice || !condition) { App.toast('请完善所有必填信息', 'warning'); return; }
        if (secondHandPrice <= 0) { App.toast('请输入有效的售价', 'warning'); return; }
        if (uploadedImageUrls.length === 0) { App.toast('请至少上传一张商品图片', 'warning'); return; }
        App.api('/api/products', { method: 'POST', body: {
            name: name, category: category, description: description,
            originalPrice: secondHandPrice, secondHandPrice: secondHandPrice,
            condition: condition.value, sellerName: user.nickname || user.username,
            sellerPhone: '', imageUrl: uploadedImageUrls, quantity: quantity
        }}).then(function(data) {
            if (data.success) { App.toast('商品发布成功！', 'success'); setTimeout(function() { window.location.href = '/product/' + data.productId; }, 800); }
            else { App.toast(data.message, 'error'); }
        });
    }
    </script>
</body>
</html>

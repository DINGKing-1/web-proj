<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 优品汇</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <a href="#main-content" class="skip-link">跳到主要内容</a>
    <header class="header">
        <nav class="nav-container">
            <div class="logo"><a href="/"><div class="logo-icon"><i class="fas fa-gem"></i></div><span class="logo-text">优品汇</span></a></div>
            <div class="search-bar"><form action="/search" method="GET"><input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input"><button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button></form></div>
            <div class="nav-actions"><th:block th:if="${isLoggedIn}"><a href="/cart" class="btn btn-ghost" aria-label="购物车" style="position:relative;"><i class="fas fa-shopping-cart"></i><span class="cart-count-badge" style="display:none">0</span></a> <a href="/upload" class="btn btn-outline"><i class="fas fa-plus"></i> 发布</a> <div class="user-dropdown" style="position:relative;"><button class="btn btn-ghost user-menu-btn" style="gap:8px;"><img src="/user-avatar/default.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;" onerror="this.src='/user-avatar/default.jpg'"><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${sessionNickname != null ? sessionNickname : sessionUsername}">用户</span><i class="fas fa-chevron-down" style="font-size:10px;"></i></button></div></th:block><th:block th:unless="${isLoggedIn}"><a href="/login" class="btn btn-outline">登录</a><a href="/login" class="btn btn-accent">注册</a></th:block></div>
        </nav>
    </header>
    <section class="category-bar"><div class="category-container"><a href="/category/全部" class="category-item">全部</a><a href="/category/手机" class="category-item">手机</a><a href="/category/笔记本电脑" class="category-item">笔记本电脑</a><a href="/category/耳机" class="category-item">耳机</a><a href="/category/相机" class="category-item">相机</a><a href="/category/手机壳" class="category-item">手机壳</a><a href="/category/空调" class="category-item">空调</a><a href="/category/冰箱" class="category-item">冰箱</a><a href="/category/半身裙" class="category-item">半身裙</a><a href="/category/其他" class="category-item">其他</a></div></section>
    <main class="main-content" id="main-content">
        <div class="page-container">
            <div class="page-header"><h1><i class="fas fa-heart" style="color:var(--color-error);"></i> 我的收藏</h1><p id="favCount">加载中...</p></div>
            <div class="product-grid stagger-children" id="favGrid">
                <div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i><p>加载中...</p></div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="footer-container"><div class="footer-section"><h4>优品汇</h4><p>致力于打造高端二手交易平台。</p></div><div class="footer-section"><h4>服务</h4><ul><li><a href="#">帮助中心</a></li><li><a href="#">交易保障</a></li></ul></div><div class="footer-section"><h4>关注</h4><div class="social-links"><a href="#"><i class="fab fa-weixin"></i></a><a href="#"><i class="fab fa-weibo"></i></a></div></div></div><div class="footer-bottom"><p>&copy; 2026 优品汇 All Rights Reserved</p></div></footer>
    <script src="/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!App.getUser()) { window.location.href = '/login'; return; }
        loadFavorites();
    });
    function loadFavorites() {
        App.api('/api/favorites').then(function(d) {
            var grid = document.getElementById('favGrid');
            if (!d.success || !d.favorites || d.favorites.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-heart-broken"></i><p>还没有收藏任何商品</p><a href="/" class="btn btn-accent" style="margin-top:16px;">去逛逛</a></div>';
                document.getElementById('favCount').textContent = '共 0 件收藏';
                return;
            }
            document.getElementById('favCount').textContent = '共 ' + d.favorites.length + ' 件收藏';
            var html = '';
            d.favorites.forEach(function(p) {
                var img = p.imageUrl || '';
                if (img.indexOf(',') > -1) img = img.split(',')[0].trim();
                var soldClass = p.status === 'sold' ? ' sold-card' : '';
                var soldBadge = p.status === 'sold' ? '<div class="product-badge sold">已售出</div>' : '';
                if (p.status === 'deleted') { soldClass = ' sold-card'; soldBadge = '<div class="product-badge sold" style="background:#8e8e93;">已下架</div>'; }
                var avatarHtml = '';
                if (p.sellerAvatar) {
                    avatarHtml += '<img src="' + p.sellerAvatar + '" class="seller-mini-avatar" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-block\'">';
                    avatarHtml += '<i class="fas fa-user-circle" style="display:none"></i>';
                } else {
                    avatarHtml += '<i class="fas fa-user-circle"></i>';
                }
                html += '<div class="product-card-premium' + soldClass + '">' +
                    '<a href="/product/' + p.id + '" style="color:inherit;text-decoration:none;display:block;">' +
                    '<div class="product-image">' +
                        (img ? '<img src="' + img + '" alt="' + (p.name||'') + '" loading="lazy" width="400" height="300">' : '<div class="image-placeholder"><i class="fas fa-image"></i></div>') +
                        soldBadge +
                    '</div>' +
                    '<div class="product-info">' +
                        '<h3 class="product-title">' + (p.name||'') + '</h3>' +
                        '<p class="product-desc">' + (p.description ? (p.description.length > 15 ? p.description.substring(0,15) + '...' : p.description) : '暂无描述') + '</p>' +
                        '<div class="product-price-row"><span class="product-price">¥' + Number(p.secondHandPrice||0).toLocaleString() + '</span></div>' +
                        '<div class="product-seller">' + avatarHtml + '<span class="seller-mini-name">' + (p.sellerName||'') + '</span></div>' +
                    '</div></a></div>';
            });
            grid.innerHTML = html;
        });
    }
    </script>
</body>
</html>

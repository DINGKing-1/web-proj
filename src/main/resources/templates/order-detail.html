<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 优品汇</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .od-wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
        .od-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-secondary);margin-bottom:20px;text-decoration:none}
        .od-back:hover{color:var(--color-accent-dark)}
        .od-card{background:rgba(255,255,255,0.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.3);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,0.04)}
        .od-card-title{font-size:15px;font-weight:600;color:var(--color-text);margin-bottom:18px;display:flex;align-items:center;gap:8px}
        .od-card-title i{color:var(--color-accent-dark);font-size:16px}
        .od-status-bar{display:flex;align-items:center;justify-content:center;gap:0;padding:36px 32px;margin-bottom:16px;background:rgba(255,255,255,0.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.3);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.04)}
        .od-step{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;flex:1}
        .od-step-dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,0.04);color:var(--color-text-light);transition:all .3s}
        .od-step.active .od-step-dot{background:linear-gradient(135deg,var(--color-accent),var(--color-accent-dark));color:#fff;box-shadow:0 6px 20px rgba(184,134,11,0.35)}
        .od-step.done .od-step-dot{background:var(--color-success);color:#fff;box-shadow:0 4px 12px rgba(90,154,90,0.3)}
        .od-step-label{font-size:14px;color:var(--color-text-light);font-weight:500}
        .od-step.active .od-step-label,.od-step.done .od-step-label{color:var(--color-text);font-weight:700}
        .od-step-line{position:absolute;top:28px;left:calc(50% + 32px);right:calc(-50% + 32px);height:3px;background:rgba(0,0,0,0.06);border-radius:2px}
        .od-step.done .od-step-line{background:var(--color-success)}
        .od-step:last-child .od-step-line{display:none}
        .od-cancelled{text-align:center;padding:32px;color:var(--color-error)}
        .od-cancelled i{font-size:40px;margin-bottom:12px;display:block}
        .od-cancelled p{font-weight:600;font-size:15px}
        .od-product{display:flex;gap:16px;align-items:center}
        .od-product-img{width:90px;height:90px;border-radius:12px;object-fit:cover;background:var(--color-bg)}
        .od-product-name{font-size:16px;font-weight:600;margin-bottom:4px}
        .od-product-cat{font-size:12px;color:var(--color-text-light);margin-bottom:8px}
        .od-product-price{font-size:24px;font-weight:700;color:var(--color-accent-dark)}
        .od-product-price .qty{font-size:13px;font-weight:500;color:var(--color-text-secondary)}
        .od-row{display:flex;padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:14px}
        .od-row:last-child{border-bottom:none}
        .od-label{width:90px;color:var(--color-text-secondary);flex-shrink:0}
        .od-val{color:var(--color-text);font-weight:500;flex:1;word-break:break-all}
        .od-val.highlight{color:var(--color-accent-dark);font-weight:700;font-size:16px}
        .od-val.status-unshipped{color:#ff9500;font-weight:600}
        .od-val.status-shipped{color:#007aff;font-weight:600}
        .od-val.status-received{color:#34c759;font-weight:600}
        .od-val.status-completed{color:#34c759;font-weight:600}
        .od-val.status-cancelled{color:#8e8e93;font-weight:600}
        .od-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
        .od-actions .btn{border-radius:10px;font-size:13px;padding:10px 20px}
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳到主要内容</a>
    <header class="header"><nav class="nav-container"><div class="logo"><a href="/"><div class="logo-icon"><i class="fas fa-gem"></i></div><span class="logo-text">优品汇</span></a></div><div class="search-bar"><form action="/search" method="GET"><input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input"><button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button></form></div><div class="nav-actions"><th:block th:if="${isLoggedIn}"><a href="/cart" class="btn btn-ghost"><i class="fas fa-shopping-cart"></i></a><a href="/upload" class="btn btn-outline"><i class="fas fa-plus"></i> 发布</a><div class="user-dropdown" style="position:relative;"><button class="btn btn-ghost user-menu-btn" style="gap:8px;"><img src="/user-avatar/default.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;" onerror="this.src='/user-avatar/default.jpg'"><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${sessionNickname != null ? sessionNickname : sessionUsername}">用户</span><i class="fas fa-chevron-down" style="font-size:10px;"></i></button></div></th:block><th:block th:unless="${isLoggedIn}"><a href="/login" class="btn btn-outline">登录</a><a href="/login" class="btn btn-accent">注册</a></th:block></div></nav></header>
    <section class="category-bar"><div class="category-container"><a href="/category/全部" class="category-item">全部</a><a href="/category/手机" class="category-item">手机</a><a href="/category/笔记本电脑" class="category-item">笔记本电脑</a><a href="/category/耳机" class="category-item">耳机</a><a href="/category/相机" class="category-item">相机</a><a href="/category/手机壳" class="category-item">手机壳</a><a href="/category/空调" class="category-item">空调</a><a href="/category/冰箱" class="category-item">冰箱</a><a href="/category/半身裙" class="category-item">半身裙</a><a href="/category/其他" class="category-item">其他</a></div></section>

    <main class="main-content" id="main-content">
    <th:block th:if="${hasOrder}">
    <div class="od-wrap">
        <a href="/my-orders" class="od-back"><i class="fas fa-arrow-left"></i> 返回订单列表</a>

        <!-- 状态时间线 -->
        <div class="od-status-bar" th:if="${order.status != 'cancelled'}">
            <div class="od-step" th:classappend="${order.status == 'unshipped' ? 'active' : (order.status == 'shipped' or order.status == 'received' or order.status == 'completed' ? 'done' : '')}">
                <div class="od-step-dot"><i class="fas fa-box"></i></div><div class="od-step-label">未发货</div><div class="od-step-line"></div>
            </div>
            <div class="od-step" th:classappend="${order.status == 'shipped' ? 'active' : (order.status == 'received' or order.status == 'completed' ? 'done' : '')}">
                <div class="od-step-dot"><i class="fas fa-shipping-fast"></i></div><div class="od-step-label">运输中</div><div class="od-step-line"></div>
            </div>
            <div class="od-step" th:classappend="${order.status == 'received' ? 'active' : (order.status == 'completed' ? 'done' : '')}">
                <div class="od-step-dot"><i class="fas fa-clipboard-check"></i></div><div class="od-step-label">待收货</div><div class="od-step-line"></div>
            </div>
            <div class="od-step" th:classappend="${order.status == 'completed' ? 'done' : ''}">
                <div class="od-step-dot"><i class="fas fa-flag-checkered"></i></div><div class="od-step-label">已完成</div>
            </div>
        </div>
        <div class="od-card" th:if="${order.status == 'cancelled'}"><div class="od-cancelled"><i class="fas fa-ban"></i><p>该订单已取消</p></div></div>

        <!-- 商品信息 - 可点击跳转商品详情 -->
        <a th:if="${order.productId != null}" th:href="'/product/' + ${order.productId}" class="od-card" style="text-decoration:none;color:inherit;display:block;transition:all 0.2s ease;cursor:pointer;" onmouseover="this.style.boxShadow='0 8px 24px rgba(0,0,0,0.08)';this.style.borderColor='var(--color-accent)'" onmouseout="this.style.boxShadow='0 4px 20px rgba(0,0,0,0.04)';this.style.borderColor='rgba(255,255,255,0.3)'">
            <div class="od-card-title"><i class="fas fa-box"></i> 商品信息 <i class="fas fa-chevron-right" style="margin-left:auto;font-size:12px;color:var(--color-text-light)"></i></div>
            <div class="od-product">
                <img th:with="imgUrl=${order.imageUrl}" th:src="${#strings.contains(imgUrl, ',') ? #strings.substring(imgUrl, 0, #strings.indexOf(imgUrl, ',')) : imgUrl}" class="od-product-img" onerror="this.src='/user-avatar/default.jpg'" alt="">
                <div>
                    <div class="od-product-name" th:text="${order.productName}">商品名</div>
                    <div class="od-product-cat" th:text="${order.category}">分类</div>
                    <div class="od-product-price">¥<span th:text="${order.productPrice != null ? #numbers.formatDecimal(order.productPrice, 1, 2) : '0.00'}">0.00</span><span th:if="${order.quantity != null and order.quantity > 1}" class="qty"> × <span th:text="${order.quantity}">1</span> 件</span></div>
                </div>
            </div>
        </a>
        <div th:unless="${order.productId != null}" class="od-card">
            <div class="od-card-title"><i class="fas fa-box"></i> 商品信息</div>
            <div class="od-product">
                <img th:with="imgUrl=${order.imageUrl}" th:src="${#strings.contains(imgUrl, ',') ? #strings.substring(imgUrl, 0, #strings.indexOf(imgUrl, ',')) : imgUrl}" class="od-product-img" onerror="this.src='/user-avatar/default.jpg'" alt="">
                <div>
                    <div class="od-product-name" th:text="${order.productName}">商品名</div>
                    <div class="od-product-cat" th:text="${order.category}">分类</div>
                    <div class="od-product-price">¥<span th:text="${order.productPrice != null ? #numbers.formatDecimal(order.productPrice, 1, 2) : '0.00'}">0.00</span><span th:if="${order.quantity != null and order.quantity > 1}" class="qty"> × <span th:text="${order.quantity}">1</span> 件</span></div>
                </div>
            </div>
        </div>

        <!-- 卖家 -->
        <div class="od-card seller-card" th:if="${order.sellerUsername != null}" id="sellerCard" style="cursor:pointer;margin-bottom:16px">
            <img src="/user-avatar/default.jpg" class="seller-avatar" id="sellerAvatar" onerror="this.src='/user-avatar/default.jpg'" alt="">
            <div class="seller-info"><div class="seller-name" id="sellerName" th:text="${order.sellerUsername}">卖家</div><div class="seller-contact">卖家</div></div>
            <div class="seller-chat-hint"><i class="fas fa-comment-dots"></i> 联系卖家</div>
        </div>

        <!-- 收货信息 + 订单信息 两列 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-map-marker-alt"></i> 收货信息</div>
                <div class="od-row"><span class="od-label">收货人</span><span class="od-val" th:text="${order.receiverName ?: '--'}">--</span></div>
                <div class="od-row"><span class="od-label">联系电话</span><span class="od-val" th:text="${order.receiverPhone ?: '--'}">--</span></div>
                <div class="od-row"><span class="od-label">收货地址</span><span class="od-val" th:text="${order.receiverAddress ?: '--'}">--</span></div>
            </div>
            <div class="od-card">
                <div class="od-card-title"><i class="fas fa-receipt"></i> 订单信息</div>
                <div class="od-row"><span class="od-label">订单编号</span><span class="od-val" th:text="${order.orderNumber != null ? order.orderNumber : order.id}">--</span></div>
                <div class="od-row"><span class="od-label">下单时间</span><span class="od-val" id="orderCreateTime">--</span></div>
                <div class="od-row"><span class="od-label">购买数量</span><span class="od-val" th:text="${order.quantity != null ? order.quantity : 1} + ' 件'">1 件</span></div>
                <div class="od-row"><span class="od-label">支付方式</span><span class="od-val" th:text="${order.paymentMethod ?: '余额支付'}">余额支付</span></div>
                <div class="od-row"><span class="od-label">订单状态</span><span class="od-val"><span th:classappend="'status-' + ${order.status}" th:with="s=${order.status}" th:text="${s == 'unshipped' ? '未发货' : (s == 'shipped' ? '运输中' : (s == 'received' ? '待收货' : (s == 'completed' ? '已完成' : '已取消')))}">--</span></span></div>
                <div class="od-row"><span class="od-label">订单金额</span><span class="od-val highlight" id="orderTotalPrice">--</span></div>
                <!-- 取消订单按钮 - 仅未发货状态显示 -->
                <div th:if="${order.status == 'unshipped' and order.username == sessionUsername}" style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(0,0,0,0.06);">
                    <button class="btn" style="width:100%;justify-content:center;background:linear-gradient(135deg,#D4604A,#c0392b);color:white;font-weight:600;padding:12px 20px;border-radius:10px;box-shadow:0 2px 8px rgba(212,96,74,0.3);transition:all 0.2s ease;" th:attr="onclick='cancelOrder(' + ${order.id} + ')'" onmouseover="this.style.boxShadow='0 4px 16px rgba(212,96,74,0.4)';this.style.transform='translateY(-1px)'" onmouseout="this.style.boxShadow='0 2px 8px rgba(212,96,74,0.3)';this.style.transform='translateY(0)'"><i class="fas fa-times"></i> 取消订单</button>
                </div>
            </div>
        </div>

        <!-- 物流 -->
        <div class="od-card" th:if="${order.trackingNumber != null and !order.trackingNumber.isEmpty()}">
            <div class="od-card-title"><i class="fas fa-truck"></i> 物流信息</div>
            <div class="od-row"><span class="od-label">快递单号</span><span class="od-val" style="color:#4f7db3;font-weight:700" th:text="${order.trackingNumber}">--</span></div>
        </div>

        <!-- 确认收货/确认完成按钮 -->
        <div th:if="${(order.status == 'shipped' or order.status == 'received') and order.username == sessionUsername}" style="margin-top:16px;">
            <button th:if="${order.status == 'shipped'}" class="btn btn-accent" style="width:100%;justify-content:center;padding:14px;font-size:15px;font-weight:600;border-radius:12px;" th:attr="onclick='receiveOrder(' + ${order.id} + ')'"><i class="fas fa-check"></i> 确认收货</button>
            <button th:if="${order.status == 'received'}" class="btn btn-accent" style="width:100%;justify-content:center;padding:14px;font-size:15px;font-weight:600;border-radius:12px;" th:attr="onclick='completeOrder(' + ${order.id} + ')'"><i class="fas fa-flag-checkered"></i> 确认完成</button>
        </div>
    </div>
    </th:block>

    <div class="od-wrap" th:if="!${hasOrder}">
        <div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>订单不存在</p><a href="/my-orders" class="btn btn-accent" style="margin-top:16px">返回订单列表</a></div>
    </div>
    </main>

    <footer class="footer"><div class="footer-container"><div class="footer-section"><h4>优品汇</h4><p>致力于打造高端二手交易平台。</p></div></div><div class="footer-bottom"><p>&copy; 2026 优品汇 All Rights Reserved</p></div></footer>

    <script src="/js/main.js"></script>
    <script th:inline="javascript">
    var sellerUsername=[[${order.sellerUsername}]],productId=[[${order.productId}]],orderPrice=[[${order.productPrice}]],orderQty=[[${order.quantity!=null?order.quantity:1}]],orderCreatedAt=[[${order.createdAt}]],sellerAvatarUrl=null,sellerNickname=null;
    document.addEventListener('DOMContentLoaded',function(){
        var total=(parseFloat(orderPrice)||0)*(parseInt(orderQty)||1);
        document.getElementById('orderTotalPrice').textContent='¥'+total.toFixed(2);
        if(orderCreatedAt){var d=new Date(orderCreatedAt);if(!isNaN(d.getTime())){var p=function(n){return n<10?'0'+n:n};document.getElementById('orderCreateTime').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}}
        if(sellerUsername&&productId){
            App.api('/api/products/'+productId).then(function(d){if(d.success&&d.product){var p=d.product;sellerAvatarUrl=p.sellerAvatar;sellerNickname=p.sellerName;if(p.sellerAvatar)document.getElementById('sellerAvatar').src=p.sellerAvatar;document.getElementById('sellerName').textContent=p.sellerName||sellerUsername}});
            document.getElementById('sellerCard').addEventListener('click',function(){contactSeller()});
        }
    });
    function contactSeller(){if(!App.getUser()){window.location.href='/login';return}if(App.getUser().username===sellerUsername){App.toast('不能和自己聊天','warning');return}App.api('/api/chat/room',{method:'POST',body:{productId:productId}}).then(function(d){if(d.success){if(d.exists)window.location.href='/messages?roomId='+d.roomId;else{var p=new URLSearchParams({sellerUsername:d.sellerUsername,sellerNickname:d.sellerNickname||sellerNickname||'',sellerAvatar:d.sellerAvatar||sellerAvatarUrl||'',productId:productId});window.location.href='/messages?'+p.toString()}}else App.toast(d.message,'error')}).catch(function(){})}
    function cancelOrder(id){App.modal({title:'取消订单',message:'确定取消该订单？余额将退还。',type:'warning',okText:'确认取消',cancelText:'返回',onOk:function(){App.api('/api/orders/'+id+'/cancel',{method:'POST'}).then(function(d){if(d.success){App.toast('订单已取消','success');setTimeout(function(){location.reload()},600)}else App.toast(d.message,'error')})}})}
    function receiveOrder(id){App.modal({title:'确认收货',message:'确认已收到该商品？',type:'info',okText:'确认收货',cancelText:'取消',onOk:function(){App.api('/api/orders/'+id,{method:'PUT',body:{status:'received'}}).then(function(d){if(d.success){App.toast('已确认收货','success');setTimeout(function(){location.reload()},600)}else App.toast(d.message,'error')})}})}
    function completeOrder(id){App.modal({title:'确认完成',message:'确认该订单已完成？',type:'info',okText:'确认完成',cancelText:'取消',onOk:function(){App.api('/api/orders/'+id+'/complete',{method:'POST'}).then(function(d){if(d.success){App.toast('订单已完成','success');setTimeout(function(){location.reload()},600)}else App.toast(d.message,'error')})}})}
    </script>
</body>
</html>

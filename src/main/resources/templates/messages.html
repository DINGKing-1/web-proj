<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息 - 优品汇</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-cn); background: var(--color-bg); }

        .chat-container {
            max-width: 1000px; width: 90%; margin: 20px auto;
            height: calc(100vh - 200px); min-height: 450px;
            background: var(--color-white); border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .chat-header-bar {
            height: 50px; background: var(--color-primary);
            display: flex; align-items: center; padding: 0 16px; flex-shrink: 0;
        }
        .chat-header-bar .logo { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }
        .chat-header-bar .logo i { color: var(--color-accent); font-size: 16px; }
        .chat-header-bar .back { margin-left: auto; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 12px; }
        .chat-header-bar .back:hover { color: #fff; }

        .chat-body { display: flex; flex: 1; overflow: hidden; }

        /* 左侧列表 */
        .panel-left {
            width: 260px; background: var(--color-white);
            border-right: 1px solid var(--color-border-light);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .panel-left-title {
            padding: 14px 16px; font-size: 14px; font-weight: 600;
            color: var(--color-text); border-bottom: 1px solid var(--color-border-light);
            flex-shrink: 0;
        }
        .contact-list { flex: 1; overflow-y: auto; overflow-x: hidden; }
        .contact-list::-webkit-scrollbar { width: 4px; }
        .contact-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

        .contact-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px; cursor: pointer;
            transition: background 0.15s; border-bottom: 1px solid var(--color-border-light);
        }
        .contact-item:hover { background: var(--color-bg-warm); }
        .contact-item.active { background: var(--color-accent-subtle, rgba(232,145,58,0.08)); border-left: 3px solid var(--color-accent); }
        .contact-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-size: 13px; color: var(--color-text); font-weight: 500; margin-bottom: 2px; }
        .contact-msg { font-size: 11px; color: var(--color-text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-meta { text-align: right; flex-shrink: 0; }
        .contact-time { font-size: 10px; color: var(--color-text-light); }
        .contact-badge { background: var(--color-error); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; display: inline-block; margin-top: 3px; }

        /* 右侧聊天区 */
        .panel-right { flex: 1; display: flex; flex-direction: column; background: var(--color-bg-warm); overflow: hidden; }

        .chat-msg-header {
            height: 46px; padding: 0 16px; background: var(--color-white);
            border-bottom: 1px solid var(--color-border-light);
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .chat-msg-header img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .chat-msg-header-name { font-size: 14px; font-weight: 600; color: var(--color-text); }

        .goods-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: var(--color-white);
            border-bottom: 1px solid var(--color-border-light);
            cursor: pointer; flex-shrink: 0;
        }
        .goods-bar img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; }
        .goods-bar .price { font-size: 13px; font-weight: 600; color: var(--color-error); }
        .goods-bar .gname { font-size: 11px; color: var(--color-text-light); }

        .msg-list {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 12px 16px;
        }
        .msg-list::-webkit-scrollbar { width: 4px; }
        .msg-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

        .msg-item { display: flex; gap: 8px; margin-bottom: 12px; max-width: 70%; }
        .msg-item.mine { margin-left: auto; flex-direction: row-reverse; }
        .msg-item img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-item .bubble {
            padding: 8px 12px; border-radius: 14px; font-size: 13px;
            line-height: 1.5; word-break: break-word; max-width: 260px;
        }
        .msg-item:not(.mine) .bubble {
            background: var(--color-white); color: var(--color-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .msg-item.mine .bubble {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
            color: #fff; border-bottom-right-radius: 4px;
            box-shadow: 0 2px 6px rgba(232,145,58,0.2);
        }
        .msg-item .mtime { font-size: 10px; color: var(--color-text-light); margin-top: 3px; }
        .msg-item.mine .mtime { text-align: right; }

        .input-area {
            padding: 8px 16px 12px; background: var(--color-white);
            border-top: 1px solid var(--color-border-light); flex-shrink: 0;
        }
        .input-tools { display: flex; gap: 4px; margin-bottom: 6px; }
        .input-tools button {
            width: 28px; height: 28px; border: none; background: none;
            color: var(--color-text-light); font-size: 16px; cursor: pointer;
            border-radius: 6px; transition: all 0.15s;
        }
        .input-tools button:hover { background: var(--color-bg-warm); color: var(--color-accent); }
        .input-row { display: flex; gap: 6px; align-items: flex-end; }
        .input-row textarea {
            flex: 1; resize: none; border: 1px solid var(--color-border);
            border-radius: 18px; padding: 8px 14px; font-size: 13px;
            font-family: inherit; max-height: 70px; background: var(--color-bg);
            line-height: 1.4; transition: all 0.2s;
        }
        .input-row textarea:focus { outline: none; border-color: var(--color-accent); background: var(--color-white); }
        .input-row .send {
            height: 32px; padding: 0 16px; border: none; border-radius: 18px;
            background: var(--color-border-light); color: var(--color-text-light);
            font-size: 12px; font-weight: 500; cursor: default; flex-shrink: 0;
            transition: all 0.2s;
        }
        .input-row .send.active {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
            color: #fff; cursor: pointer;
            box-shadow: 0 2px 6px rgba(232,145,58,0.25);
        }

        .no-chat {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--color-text-light);
        }
        .no-chat i { font-size: 64px; margin-bottom: 16px; opacity: 0.15; color: var(--color-accent); }
        .no-chat p { font-size: 13px; }

        @media (max-width: 768px) {
            .chat-container { width: 95%; height: calc(100vh - 100px); }
            .panel-left { display: none; }
            .panel-left.show { display: flex; position: absolute; inset: 0; z-index: 10; width: 100%; }
        }
    </style>
</head>
<body>
<a href="#main-content" class="skip-link">跳到主要内容</a>
<header class="header"><nav class="nav-container"><div class="logo"><a href="/"><div class="logo-icon"><i class="fas fa-gem"></i></div><span class="logo-text">优品汇</span></a></div><div class="search-bar"><form action="/search" method="GET"><input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input"><button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button></form></div><div class="nav-actions"><th:block th:if="${isLoggedIn}"><a href="/cart" class="btn btn-ghost" aria-label="购物车" style="position:relative;"><i class="fas fa-shopping-cart"></i><span class="cart-count-badge" style="display:none">0</span></a> <a href="/upload" class="btn btn-outline"><i class="fas fa-plus"></i> 发布</a> <div class="user-dropdown" style="position:relative;"><button class="btn btn-ghost user-menu-btn" style="gap:8px;"><img src="/user-avatar/default.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;" onerror="this.src='/user-avatar/default.jpg'"><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${sessionNickname != null ? sessionNickname : sessionUsername}">用户</span><i class="fas fa-chevron-down" style="font-size:10px;"></i></button></div></th:block><th:block th:unless="${isLoggedIn}"><a href="/login" class="btn btn-outline">登录</a><a href="/login" class="btn btn-accent">注册</a></th:block></div></nav></header>
<section class="category-bar"><div class="category-container"><a href="/category/手机" class="category-item">手机</a><a href="/category/笔记本电脑" class="category-item">笔记本电脑</a><a href="/category/耳机" class="category-item">耳机</a><a href="/category/相机" class="category-item">相机</a><a href="/category/手机壳" class="category-item">手机壳</a><a href="/category/空调" class="category-item">空调</a><a href="/category/冰箱" class="category-item">冰箱</a><a href="/category/半身裙" class="category-item">半身裙</a><a href="/category/其他" class="category-item">其他</a></div></section>

<main class="main-content" id="main-content">
<div class="chat-container">
    <div class="chat-header-bar">
        <a href="/" class="logo"><i class="fas fa-gem"></i> 优品汇</a>
        <a href="/" class="back"><i class="fas fa-arrow-left"></i> 返回首页</a>
    </div>
    <div class="chat-body">
        <div class="panel-left" id="panelLeft">
            <div class="panel-left-title">消息</div>
            <div class="contact-list" id="contactList"></div>
        </div>
        <div class="panel-right">
            <div class="no-chat" id="noChat">
                <i class="fas fa-comments"></i>
                <p>选择一个会话开始聊天</p>
            </div>
            <div id="chatRoom" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
                <div class="chat-msg-header">
                    <img id="chatAvatar" src="/user-avatar/default.jpg" onerror="this.src='/user-avatar/default.jpg'" style="display:none;">
                    <span class="chat-msg-header-name" id="chatName">聊天</span>
                </div>
                <div class="goods-bar" id="goodsBar" style="display:none;" onclick="goProduct()">
                    <img id="goodsImg" src="" onerror="this.src='/user-avatar/default.jpg'">
                    <div>
                        <div class="price" id="goodsPrice">¥0</div>
                        <div class="gname" id="goodsName">商品</div>
                    </div>
                </div>
                <div class="msg-list" id="msgList"></div>
                <div class="input-area">
                    <div class="input-tools">
                        <button onclick="document.getElementById('imgIn').click()" title="图片"><i class="fas fa-image"></i></button>
                        <input type="file" id="imgIn" accept="image/*" style="display:none">
                    </div>
                    <div class="input-row">
                        <textarea id="msgIn" placeholder="输入消息..." rows="1"></textarea>
                        <button class="send" id="sendBtn" onclick="send()">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<footer class="footer"><div class="footer-container"><div class="footer-section"><h4>优品汇</h4><p>致力于打造高端二手交易平台。</p></div></div><div class="footer-bottom"><p>&copy; 2026 优品汇 All Rights Reserved</p></div></footer>

<script src="/js/main.js"></script>
<script>
var me=null,them=null,rid=null,lastId=0,poll=null,busy=false,w=null,pid=null;

document.addEventListener('DOMContentLoaded',function(){
    me=App.getUser();
    if(!me){location.href='/login';return;}
    App.api('/api/session').then(function(d){
        if(!d.success){location.href='/login';return;}
        var p=new URLSearchParams(location.search);
        loadList(function(){
            if(p.get('roomId'))openById(+p.get('roomId'));
            else if(p.get('sellerUsername')){
                w={u:p.get('sellerUsername'),n:p.get('sellerNickname')||p.get('sellerUsername'),a:p.get('sellerAvatar')||'/user-avatar/default.jpg',p:p.get('productId')};
                openW();
            }
        });
    });
});
window.onpagehide=function(){if(poll)clearInterval(poll);};

function openById(id){
    App.api('/api/chat/rooms').then(function(d){
        if(!d.success)return;
        var r=d.rooms.find(function(x){return x.roomId===id;});
        if(r)go(r.roomId,r.otherNickname,r.otherAvatar||'/user-avatar/default.jpg',r.otherUsername,r.productId);
    });
}

function loadList(cb){
    App.api('/api/chat/rooms').then(function(d){
        var el=document.getElementById('contactList');
        if(!d.success||!d.rooms||!d.rooms.length){
            el.innerHTML='<div style="padding:40px;text-align:center;color:var(--color-text-light);font-size:13px;">暂无消息</div>';
            if(cb)cb();return;
        }
        el.innerHTML='';
        d.rooms.forEach(function(r){
            var div=document.createElement('div');
            div.className='contact-item'+(rid===r.roomId?' active':'');
            div.onclick=function(){go(r.roomId,r.otherNickname,r.otherAvatar||'/user-avatar/default.jpg',r.otherUsername,r.productId);};
            var t=r.lastMessageTime?App.formatTime(r.lastMessageTime):'';
            var badge=r.unread>0?'<div class="contact-badge">'+r.unread+'</div>':'';
            div.innerHTML='<img src="'+(r.otherAvatar||'/user-avatar/default.jpg')+'" onerror="this.src=\'/user-avatar/default.jpg\'">'+
                '<div class="contact-info"><div class="contact-name">'+esc(r.otherNickname||'')+'</div><div class="contact-msg">'+esc(r.lastMessage||'暂无消息')+'</div></div>'+
                '<div class="contact-meta"><div class="contact-time">'+t+'</div>'+badge+'</div>';
            el.appendChild(div);
        });
        if(cb)cb();
    });
}

function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s||''));return d.innerHTML;}
function esc2(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function go(id,name,av,user,p){
    rid=id;lastId=0;pid=p;
    them={u:user,n:name,a:av};
    document.getElementById('noChat').style.display='none';
    document.getElementById('chatRoom').style.display='flex';
    document.getElementById('chatName').textContent=name;
    var avImg=document.getElementById('chatAvatar');
    avImg.src=av;avImg.style.display='inline';
    document.querySelectorAll('.contact-item').forEach(function(e){e.classList.remove('active');});
    var items=document.querySelectorAll('.contact-item');
    items.forEach(function(el){if(el.onclick&&el.onclick.toString().indexOf(id)>-1)el.classList.add('active');});
    loadGoods(p);
    document.getElementById('msgList').innerHTML='';
    loadMsgs();
    startPoll();
    var inp=document.getElementById('msgIn');
    inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
    inp.oninput=function(){var btn=document.getElementById('sendBtn');if(this.value.trim())btn.classList.add('active');else btn.classList.remove('active');};
    document.getElementById('imgIn').onchange=function(){
        if(!this.files[0])return;
        var r=new FileReader();
        r.onload=function(e){App.api('/api/upload-image',{method:'POST',body:{image:e.target.result}}).then(function(d){if(d.success)App.api('/api/chat/message',{method:'POST',body:{roomId:rid,content:d.imageUrl,type:'image'}}).then(loadMsgs);});};
        r.readAsDataURL(this.files[0]);this.value='';
    };
}

function loadGoods(p){
    var bar=document.getElementById('goodsBar');
    if(!p){bar.style.display='none';return;}
    App.api('/api/products/'+p).then(function(d){
        if(d.success&&d.product){
            var pr=d.product,img=pr.imageUrl||'';
            if(img.indexOf(',')>-1)img=img.split(',')[0].trim();
            document.getElementById('goodsImg').src=img||'/user-avatar/default.jpg';
            document.getElementById('goodsPrice').textContent='¥'+Number(pr.secondHandPrice||0).toFixed(2);
            document.getElementById('goodsName').textContent=pr.name||'';
            bar.style.display='flex';bar.dataset.pid=p;
        }
    });
}
function goProduct(){var b=document.getElementById('goodsBar');if(b.dataset.pid)window.open('/product/'+b.dataset.pid,'_blank');}

function openW(){
    if(!w)return;
    rid=null;lastId=0;pid=w.p;
    them={u:w.u,n:w.n,a:w.a};
    document.getElementById('noChat').style.display='none';
    document.getElementById('chatRoom').style.display='flex';
    document.getElementById('chatName').textContent=w.n;
    document.getElementById('msgList').innerHTML='<div style="text-align:center;color:var(--color-text-light);padding:40px;font-size:13px;">发送消息开始对话</div>';
    if(w.p)loadGoods(w.p);
    var inp=document.getElementById('msgIn');
    inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
    inp.oninput=function(){var btn=document.getElementById('sendBtn');if(this.value.trim())btn.classList.add('active');else btn.classList.remove('active');};
}

function send(){
    var inp=document.getElementById('msgIn');
    var txt=inp.value.trim();
    if(!txt)return;
    if(!rid&&w){
        App.api('/api/chat/room/create',{method:'POST',body:{sellerUsername:w.u,productId:parseInt(w.p)}}).then(function(d){
            if(d.success){rid=d.roomId;w=null;inp.value='';inp.style.height='auto';document.getElementById('sendBtn').classList.remove('active');App.api('/api/chat/message',{method:'POST',body:{roomId:rid,content:txt,type:'text'}}).then(function(){loadMsgs();loadList();});}
            else App.toast(d.message,'error');
        });return;
    }
    if(!rid)return;
    inp.value='';inp.style.height='auto';document.getElementById('sendBtn').classList.remove('active');
    App.api('/api/chat/message',{method:'POST',body:{roomId:rid,content:txt,type:'text'}}).then(function(d){if(d.success)loadMsgs();});
}

function loadMsgs(){
    if(!rid||!me)return;
    App.api('/api/chat/messages/'+rid+(lastId>0?'?sinceId='+lastId:'')).then(function(d){
        if(!d.success||!d.messages)return;
        var el=document.getElementById('msgList');
        var atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;
        d.messages.forEach(function(m){
            if(m.id>lastId){
                var mine=m.senderUsername===me.username;
                var av=mine?(me.avatar||'/user-avatar/default.jpg'):(them?them.a:'/user-avatar/default.jpg');
                var content=m.messageType==='image'?'<img src="'+esc2(m.content)+'" style="max-width:200px;border-radius:8px;cursor:pointer;" onclick="window.open(this.src)">':esc(m.content).replace(/\n/g,'<br>');
                el.insertAdjacentHTML('beforeend',
                    '<div class="msg-item'+(mine?' mine':'')+'">'+
                    '<img src="'+esc2(av)+'" onerror="this.src=\'/user-avatar/default.jpg\'">'+
                    '<div><div class="bubble">'+content+'</div>'+
                    '<div class="mtime">'+App.formatTime(m.createdAt)+'</div></div></div>'
                );
                lastId=m.id;
            }
        });
        if(atBottom)el.scrollTop=el.scrollHeight;
        loadList();App.updateSideNavBadge();
    });
}

function startPoll(){if(poll)clearInterval(poll);poll=setInterval(loadMsgs,3000);}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 优品汇</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'PingFang SC','Microsoft YaHei',-apple-system,sans-serif; background:linear-gradient(135deg, #1e1b18 0%, #2c2c2c 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:#fff; border-radius:16px; padding:44px 40px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.3); animation: fadeInUp 0.6s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
        .login-card .logo { text-align:center; margin-bottom:32px; }
        .login-card .logo-icon { width:52px; height:52px; background:linear-gradient(135deg,#c9a96e,#b8860b); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; margin:0 auto 12px; }
        .login-card h1 { font-size:20px; font-weight:600; color:#1e1b18; }
        .login-card p { font-size:13px; color:#78716c; margin-top:6px; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:13px; font-weight:500; color:#1e1b18; margin-bottom:6px; }
        .form-group input { width:100%; padding:12px 16px; font-size:14px; border:1px solid #e8e4df; border-radius:8px; background:#faf8f5; transition:all 0.2s; }
        .form-group input:focus { border-color:#c9a96e; box-shadow:0 0 0 3px rgba(201,169,110,0.1); outline:none; }
        .btn-submit { width:100%; padding:13px; font-size:14px; font-weight:600; background:linear-gradient(135deg,#c9a96e,#b8860b); color:#fff; border:none; border-radius:8px; cursor:pointer; transition:all 0.2s; }
        .btn-submit:hover { opacity:0.9; transform:translateY(-1px); }
        .error-msg { color:#c84b41; font-size:13px; margin-top:8px; display:none; text-align:center; }
        .back-link { text-align:center; margin-top:20px; }
        .back-link a { color:#78716c; font-size:13px; text-decoration:none; }
        .back-link a:hover { color:#1e1b18; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><div class="logo-icon"><i class="fas fa-gem"></i></div><h1>优品汇 管理后台</h1><p>请使用管理员账号登录</p></div>
        <div class="form-group"><label>用户名</label><input type="text" id="adminUsername" placeholder="请输入管理员账号"></div>
        <div class="form-group"><label>密码</label><input type="password" id="adminPassword" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()"></div>
        <div class="error-msg" id="errorMsg">账号或密码错误</div>
        <button class="btn-submit" onclick="login()">登 录</button>
        <div class="back-link"><a href="/"><i class="fas fa-arrow-left"></i> 返回前台</a></div>
    </div>
    <script>
    function login() {
        var username = document.getElementById('adminUsername').value.trim();
        var password = document.getElementById('adminPassword').value.trim();
        if (!username || !password) { showError('请输入账号和密码'); return; }
        fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username,password:password}) })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) { sessionStorage.setItem('adminUser', JSON.stringify({username:d.username})); window.location.href = '/admin/dashboard'; }
            else { showError(d.message || '登录失败'); }
        })
        .catch(function() { showError('网络错误'); });
    }
    function showError(msg) { var el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; setTimeout(function() { el.style.display = 'none'; }, 3000); }
    </script>
</body>
</html>

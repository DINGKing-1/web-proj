<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>仪表盘 - 优品汇管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'PingFang SC','Microsoft YaHei',-apple-system,sans-serif; background:#faf8f5; color:#1e1b18; display:flex; min-height:100vh; }
        .sidebar { width:220px; background:#1e1b18; color:#fff; padding-top:24px; position:fixed; top:0; bottom:0; left:0; z-index:100; display:flex; flex-direction:column; }
        .sidebar h2 { text-align:center; padding:16px; font-size:15px; font-weight:700; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; gap:8px; }
        .sidebar h2 i { color:#c9a96e; }
        .sidebar a, .sidebar button { display:flex; align-items:center; gap:10px; padding:14px 24px; color:rgba(255,255,255,0.5); text-decoration:none; font-size:13px; transition:all 0.2s; background:none; border:none; cursor:pointer; width:100%; text-align:left; font-family:inherit; }
        .sidebar a:hover, .sidebar a.active, .sidebar button:hover { background:rgba(255,255,255,0.04); color:#c9a96e; }
        .sidebar a i, .sidebar button i { width:16px; text-align:center; }
        .main { margin-left:220px; flex:1; padding:28px 32px; }
        .header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
        .header-bar h1 { font-size:20px; font-weight:700; }
        .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
        .stat-card { background:#fff; padding:24px; border-radius:14px; border:1px solid #f0ece8; transition:all 0.25s; animation:fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .stat-card:hover { box-shadow:0 8px 24px rgba(0,0,0,0.06); transform:translateY(-2px); }
        .stat-card .icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff; margin-bottom:12px; }
        .stat-card .icon.blue { background:#4f7db3; }
        .stat-card .icon.green { background:#2d8a56; }
        .stat-card .icon.orange { background:#d98c2e; }
        .stat-card h3 { font-size:28px; font-weight:700; }
        .stat-card p { color:#78716c; font-size:12px; margin-top:2px; }
        .stat-card:nth-child(1) { animation-delay:0.05s; }
        .stat-card:nth-child(2) { animation-delay:0.15s; }
        .stat-card:nth-child(3) { animation-delay:0.25s; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-gem"></i> 优品汇</h2>
        <a href="/admin/dashboard" class="active"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
        <a href="/admin/products"><i class="fas fa-box"></i> 商品管理</a>
        <a href="/admin/users"><i class="fas fa-users"></i> 用户管理</a>
        <a href="/" target="_blank"><i class="fas fa-external-link-alt"></i> 查看前台</a>
        <div style="flex:1;"></div>
        <button onclick="logout()" style="border-top:1px solid rgba(255,255,255,0.06);margin-bottom:8px;"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
    </div>
    <div class="main">
        <div class="header-bar"><h1>仪表盘</h1><span style="font-size:13px;color:#78716c;">管理员</span></div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="icon blue"><i class="fas fa-box"></i></div><h3>--</h3><p>商品总数</p></div>
            <div class="stat-card"><div class="icon green"><i class="fas fa-users"></i></div><h3>--</h3><p>注册用户</p></div>
            <div class="stat-card"><div class="icon orange"><i class="fas fa-comments"></i></div><h3>--</h3><p>评论总数</p></div>
        </div>
    </div>
    <script>
    if (!sessionStorage.getItem('adminUser')) { window.location.href = '/admin'; }
    function logout() { sessionStorage.removeItem('adminUser'); window.location.href = '/admin'; }
    fetch('/api/admin/stats').then(function(r) { return r.json(); }).then(function(d) {
        if (d.success) {
            var cards = document.querySelectorAll('.stat-card h3');
            cards[0].textContent = d.totalProducts;
            cards[1].textContent = d.totalUsers;
            cards[2].textContent = d.totalComments;
        }
    });
    </script>
</body>
</html>

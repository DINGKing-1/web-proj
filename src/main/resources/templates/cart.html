<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>购物车 - 优品汇</title>
    <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <a href="#main-content" class="skip-link">跳到主要内容</a>
    <header class="header"><nav class="nav-container"><div class="logo"><a href="/"><div class="logo-icon"><i class="fas fa-gem"></i></div><span class="logo-text">优品汇</span></a></div><div class="search-bar"><form action="/search" method="GET"><input type="text" name="q" placeholder="搜索优质二手商品..." class="search-input"><button type="submit" class="search-btn" aria-label="搜索"><i class="fas fa-search"></i></button></form></div><div class="nav-actions"><th:block th:if="${isLoggedIn}"><a href="/cart" class="btn btn-ghost" aria-label="购物车" style="position:relative;"><i class="fas fa-shopping-cart"></i><span class="cart-count-badge" style="display:none">0</span></a> <a href="/upload" class="btn btn-outline"><i class="fas fa-plus"></i> 发布</a> <div class="user-dropdown" style="position:relative;"><button class="btn btn-ghost user-menu-btn" style="gap:8px;"><img src="/user-avatar/default.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;" onerror="this.src='/user-avatar/default.jpg'"><span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${sessionNickname != null ? sessionNickname : sessionUsername}">用户</span><i class="fas fa-chevron-down" style="font-size:10px;"></i></button></div></th:block><th:block th:unless="${isLoggedIn}"><a href="/login" class="btn btn-outline">登录</a><a href="/login" class="btn btn-accent">注册</a></th:block></div></nav></header>
    <section class="category-bar"><div class="category-container"><a href="/category/全部" class="category-item">全部</a><a href="/category/手机" class="category-item">手机</a><a href="/category/笔记本电脑" class="category-item">笔记本电脑</a><a href="/category/耳机" class="category-item">耳机</a><a href="/category/相机" class="category-item">相机</a><a href="/category/手机壳" class="category-item">手机壳</a><a href="/category/空调" class="category-item">空调</a><a href="/category/冰箱" class="category-item">冰箱</a><a href="/category/半身裙" class="category-item">半身裙</a><a href="/category/其他" class="category-item">其他</a></div></section>
    <main class="main-content" id="main-content">
        <div class="page-container">
            <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
                <h1><i class="fas fa-shopping-cart"></i> 购物车</h1>
                <button id="clearCartBtn" class="btn btn-outline" style="display:none;color:var(--color-error);border-color:var(--color-error);" onclick="clearCart()"><i class="fas fa-trash-alt"></i> 清空购物车</button>
            </div>
            <div id="cartItems"><div class="empty-state"><i class="fas fa-shopping-cart"></i><p>购物车是空的</p><a href="/" class="btn btn-accent" style="margin-top:16px;">去逛逛</a></div></div>
            <div class="cart-summary" id="cartSummary" style="display:none;"><div class="total">合计: <span id="cartTotal">¥0</span></div><button class="btn btn-accent btn-lg ripple" onclick="gotoCheckout()">去结算</button></div>
        </div>
    </main>
    <footer class="footer"><div class="footer-container"><div class="footer-section"><h4>优品汇</h4><p>致力于打造高端二手交易平台。</p></div></div><div class="footer-bottom"><p>&copy; 2026 优品汇 All Rights Reserved</p></div></footer>
    <script src="/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', loadCart);
    function loadCart() {
        var user = App.getUser();
        if (!user) { document.getElementById('cartItems').innerHTML = '<div class="empty-state"><i class="fas fa-shopping-cart"></i><p>请先登录</p><a href="/login" class="btn btn-accent" style="margin-top:16px;">去登录</a></div>'; document.getElementById('clearCartBtn').style.display = 'none'; return; }
        App.api('/api/cart').then(function(data) {
            if (!data.success || !data.items || data.items.length === 0) {
                document.getElementById('cartItems').innerHTML = '<div class="empty-state"><i class="fas fa-shopping-cart"></i><p>购物车是空的</p><a href="/" class="btn btn-accent" style="margin-top:16px;">去逛逛</a></div>';
                document.getElementById('cartSummary').style.display = 'none';
                document.getElementById('clearCartBtn').style.display = 'none';
                return;
            }
            var html = '', total = 0;
            data.items.forEach(function(item) {
                var price = item.price || 0;
                if (item.available) total += price;
                var img = item.image || '';
                if (img.indexOf(',') > -1) img = img.split(',')[0].trim();
                html += '<div class="cart-item' + (item.available ? '' : ' unavailable') + '">' +
                    '<a href="/product/' + item.productId + '">' +
                    (img ? '<img src="' + img + '" class="cart-item-image" onerror="this.style.display=\'none\'" alt="">' : '<div class="cart-item-image" style="background:var(--color-bg-warm);display:flex;align-items:center;justify-content:center;"><i class="fas fa-image" style="color:var(--color-border);"></i></div>') +
                    '</a>' +
                    '<div class="cart-item-info">' +
                        '<a href="/product/' + item.productId + '" style="color:inherit;text-decoration:none;"><h4>' + (item.productName || '未知商品') + '</h4></a>' +
                        '<div class="price" style="color:' + (item.available ? 'var(--color-accent-dark)' : 'var(--color-text-light)') + ';">¥' + Number(price).toLocaleString() + '</div>' +
                        (item.available ? '' : '<div style="font-size:12px;color:var(--color-error);margin-top:4px;">商品已下架</div>') +
                    '</div>' +
                    '<button class="cart-item-remove" onclick="removeItem(' + item.id + ')" title="移除"><i class="fas fa-trash-alt"></i></button></div>';
            });
            document.getElementById('cartItems').innerHTML = html;
            document.getElementById('cartSummary').style.display = 'block';
            document.getElementById('cartTotal').textContent = '¥' + total.toLocaleString();
            document.getElementById('clearCartBtn').style.display = 'inline-flex';
        });
    }
    function removeItem(id) {
        App.modal({ title: '移除商品', message: '确定要从购物车移除该商品吗？', type: 'warning', okText: '移除', cancelText: '取消',
            onOk: function() {
                App.api('/api/cart/' + id, { method: 'DELETE' }).then(function(data) {
                    if (data.success) { App.toast('已移除', 'success'); loadCart(); App.updateSideNavBadge(); }
                    else { App.toast(data.message, 'error'); }
                });
            }
        });
    }
    function clearCart() {
        App.modal({ title: '清空购物车', message: '确定要清空购物车中的所有商品吗？', type: 'warning', okText: '清空', cancelText: '取消',
            onOk: function() {
                App.api('/api/cart', { method: 'DELETE' }).then(function(data) {
                    if (data.success) { App.toast('购物车已清空', 'success'); loadCart(); App.updateSideNavBadge(); }
                    else { App.toast(data.message, 'error'); }
                });
            }
        });
    }
    function gotoCheckout() { window.location.href = '/checkout'; }
    </script>
</body>
</html>

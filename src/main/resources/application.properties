# Server Configuration
# 本地机密（数据库/邮箱口令）放在 config/secrets.properties，该文件不入库。
# 环境变量 MYSQL_PASSWORD / MAIL_PASSWORD 优先级更高，可覆盖之。
spring.config.import=optional:file:./config/secrets.properties

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Session Cookie 加固：HttpOnly + SameSite（同站请求携带，阻断跨站 POST 的 CSRF）
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Static Resources（商品图/头像由 StorageProperties 统一映射，见 WebConfig）
spring.web.resources.static-locations=classpath:/static/,file:product-images/

# MySQL Database Configuration
# Prefer env vars in real deployments; defaults are for local dev only.
spring.datasource.url=jdbc:mysql://localhost:3306/seconddata?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
# Set MYSQL_PASSWORD env in shared/production environments.
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池
spring.datasource.hikari.pool-name=MallHikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# JPA：表结构由 Flyway 管理，禁止自动改表（生产 update 可能丢数据）
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# Flyway（已有库 baseline 后只跑增量；空库执行 V1 全量建表）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Cache：默认 Caffeine 单机缓存；生产/集群切换 application-prod 的 Redis
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=60s
mall.cache.product-list-ttl=60s

# 文件存储：local 可指向共享盘（NFS/云盘）实现多节点一致
mall.storage.type=local
mall.storage.root=${MALL_STORAGE_ROOT:}

# 发布审核：true=新商品先进 pending，管理员通过才上前台；false=直接上架
mall.product.review-required=${PRODUCT_REVIEW_REQUIRED:true}

# 钱包：模拟充值仅限演示。生产（application-prod）必须关闭，避免无限刷余额。
# 即使开启也限制单笔与累计上限，降低滥用面。
mall.wallet.mock-recharge-enabled=${MOCK_RECHARGE_ENABLED:true}
mall.wallet.mock-recharge-max-single=${MOCK_RECHARGE_MAX_SINGLE:50000}
mall.wallet.mock-recharge-max-cumulative=${MOCK_RECHARGE_MAX_CUMULATIVE:200000}

# 新用户初始余额（演示给启动资金；生产应为 0）
mall.user.initial-balance=${USER_INITIAL_BALANCE:10000}

# 管理员初始化口令：仅在创建 admin 账号时使用，绝不覆盖已有密码。
# 留空则首次创建时生成随机口令并打印一次。生产建议留空或注入 MALL_ADMIN_PASSWORD。
mall.security.admin-init-password=${MALL_ADMIN_PASSWORD:admin123}
# 非 BCrypt 历史口令：只告警不重置（避免批量打成弱口令）
mall.security.legacy-password-repair=false
# 开发环境是否允许把找回密码验证码打进日志（生产必须 false）
mall.security.log-mail-codes=${LOG_MAIL_CODES:false}

# 接口文档：Swagger UI → /swagger-ui.html ；OpenAPI JSON → /v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorting=method
springdoc.packages-to-scan=com.secondhand.mall.controller
springdoc.show-actuator=false

# 异步线程池（通知推送等出主流程，避免大促阻塞请求线程）
mall.async.core-pool-size=4
mall.async.max-pool-size=16
mall.async.queue-capacity=1000
mall.async.thread-name-prefix=mall-async-

# Logging
logging.level.com.secondhand.mall=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=INFO

# 邮件（找回密码验证码）。真实发信：到 QQ 邮箱开启 SMTP 并生成授权码
# MAIL_USERNAME / MAIL_PASSWORD 用环境变量或 config/secrets.properties 提供，不入库
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# 生产/集群配置示例：--spring.profiles.active=prod
# 启动前确保 MySQL、Redis 可用，存储根目录为共享卷或后续切换对象存储

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:seconddata}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# 连接池按实例规格调整；多实例时 maximum-pool-size 不宜超过 MySQL max_connections/实例数
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
# 行锁等待 5 秒超时，避免死锁/长事务永久阻塞（统一加锁顺序：商品→卖家→买家）
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5

# Redis 分布式缓存：热门商品列表多节点共享
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# 集群部署：共享存储根目录（NFS/云盘挂载），保证各节点图片一致
# 若使用 OSS/MinIO，可后续实现 StorageService 的对象存储版本
mall.storage.type=local
mall.storage.root=${MALL_STORAGE_ROOT:/mnt/shared/mall-uploads}

spring.thymeleaf.cache=true
logging.level.com.secondhand.mall=WARN

# 资金安全：生产禁用模拟充值与演示初始余额
mall.wallet.mock-recharge-enabled=false
mall.user.initial-balance=0
# 演示数据/初始化脚本：生产一律禁止
mall.demo-data.enabled=false
spring.sql.init.mode=never
# 管理员口令必须外部注入；留空时首次创建生成随机口令
mall.security.admin-init-password=${MALL_ADMIN_PASSWORD:}
mall.security.legacy-password-repair=false
mall.security.log-mail-codes=false

# 生产环境关闭 Swagger 文档与 UI，防接口枚举
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
mall.security.swagger-basic-auth-enabled=false
